api_platform:
    title: API de test Kewin
    description: |
        API de test commune aux boilerplates front (Next, Nuxt, SvelteKit, Symfony Twig, HTML).
        Formats : JSON simple (`application/json`, format par défaut) et JSON-LD (`application/ld+json`).
        En dev et en test, l'en-tête `X-Scenario: error` renvoie une 500 et `X-Scenario: empty` une collection vide (sur `/api/products` : liste sans produit, totaux et compteurs à 0).
    version: 1.0.0
    mapping:
        paths:
            - '%kernel.project_dir%/src/Task/Infrastructure/ApiPlatform/Resource'
            - '%kernel.project_dir%/src/Blog/Infrastructure/ApiPlatform/Resource'
            - '%kernel.project_dir%/src/Catalog/Infrastructure/ApiPlatform/Resource'
            - '%kernel.project_dir%/src/Contact/Infrastructure/ApiPlatform/Resource'
    formats:
        json: ['application/json']
        jsonld: ['application/ld+json']
    docs_formats:
        jsonopenapi: ['application/vnd.openapi+json']
        yamlopenapi: ['application/vnd.openapi+yaml']
        jsonld: ['application/ld+json']
        html: ['text/html']
    defaults:
        stateless: true
        pagination_enabled: false
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin', 'X-Scenario']
    exception_to_status:
        App\Catalog\Domain\CategoryNotFound: 404
